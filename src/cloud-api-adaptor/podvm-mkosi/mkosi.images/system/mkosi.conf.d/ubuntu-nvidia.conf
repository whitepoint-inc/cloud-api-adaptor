# NVIDIA GPU support for the Azure peer-pod VM (fort-ai: Standard_NCC40ads_H100_v5, an AMD
# SEV-SNP CVM with one H100 NVL in NVIDIA Confidential Computing mode).
#
# Kernel modules: Canonical's PRECOMPILED, SIGNED open-kernel-module build of the 595
# server driver for the image's generic kernel. The -generic meta package resolves to the
# same kernel ABI as linux-image-generic in the same archive snapshot, so the pair cannot
# drift; if Canonical has not yet built modules for a brand-new ABI the image build fails
# loudly instead of producing a GPU-less image. (The pod VM boots without Secure Boot, so
# the signature is not load-bearing; it is simply what Canonical ships.)
#
# Userspace: nvidia-smi + the driver libraries the container toolkit maps into containers,
# and nvidia-persistenced. CC mode needs the open driver >= R550; 595 is the GPU Operator
# 26.7 recommended branch.
#
# Container toolkit (NVIDIA apt repo, see ../../../mkosi.sandbox): nvidia-ctk generates the
# CDI spec at boot (nvidia-cdi.service) and nvidia-cdi-hook runs inside the container
# lifecycle; the kata-agent injects the devices/mounts/hooks from that spec when the pod
# carries cdi.k8s.io/peer-pods (set by the cloud-api-adaptor from
# io.katacontainers.config.hypervisor.default_gpus).
[Match]
Distribution=ubuntu
Architecture=x86-64

[Content]
Packages=
    linux-modules-nvidia-595-server-open-generic
    nvidia-utils-595-server
    nvidia-compute-utils-595-server
    libnvidia-compute-595-server
    libnvidia-cfg1-595-server
    nvidia-container-toolkit-base
    libnvidia-container1
    libnvidia-container-tools
    pciutils

# Use cloud-init ONLY for the Azure provisioning handshake. The Azure datasource
# crawl reports provisioning-complete to the wireserver (168.63.129.16), which is
# what lets the VM leave "creating". Empty module lists => cloud-init runs no
# config modules, so it never touches users/ssh or the kata UserData (which
# process-user-data owns). datasource_list pins it to Azure (no probing).
datasource_list: [ Azure ]
cloud_init_modules: []
cloud_config_modules: []
cloud_final_modules: []
